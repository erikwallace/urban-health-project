<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Urban Health Project</title>
  {% if page.intern and page.site %}
    {% assign pg_description = page.intern | append: "'s Urban Health Project internship reflection at " | append: page.site | append: ", " | append: page.year | append: "." %}
  {% else %}
    {% assign pg_description = page.description %}
  {% endif %}
  <meta name="description" content="{{ pg_description }}">
  <meta name="author" content="Erik Wallace">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Urban Health Project">
  <meta property="og:title" content="{{ page.title }} | Urban Health Project">
  <meta property="og:description" content="{{ pg_description }}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <meta property="og:image" content="{{ "/imgs/logo-uhp-mark-solo.png" | prepend: site.baseurl | prepend: site.url }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title }} | Urban Health Project">
  <meta name="twitter:description" content="{{ pg_description }}">
  <meta name="twitter:image" content="{{ "/imgs/logo-uhp-mark-solo.png" | prepend: site.baseurl | prepend: site.url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": "Urban Health Project",
    "url": "https://urbanhealthproject.org",
    "logo": "https://urbanhealthproject.org/imgs/logo-uhp-mark-solo.png",
    "description": "Urban Health Project educates, inspires, and challenges medical students through their service to vulnerable populations in Greater Cincinnati to produce more socially responsible physicians who have a greater understanding of factors that impact health.",
    "email": "urbanhealthproject@gmail.com",
    "sameAs": [
      "https://www.instagram.com/cincyuhp/",
      "https://www.youtube.com/channel/UClIzQ8FhuIcBW2iI3XmBPAQ"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="{{ "/css/main-20260823a.css" | prepend: site.baseurl }}">

  <link rel="apple-touch-icon" sizes="152x152" href="{{ "/imgs/apple-touch-icon-152x152.png" | prepend: site.baseurl }}" />
  <link rel="icon" type="image/png" href="{{ "/imgs/favicon-32x32.png" | prepend: site.baseurl }}" sizes="32x32" />
  <link rel="icon" type="image/png" href="{{ "/imgs/favicon-16x16.png" | prepend: site.baseurl }}" sizes="16x16" />
  <link rel="manifest" href="{{ "/site.webmanifest" | prepend: site.baseurl }}">
  <meta name="theme-color" content="#2c3e50">

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css?family=Merriweather:400,700|Oswald:400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Merriweather:400,700|Oswald:400&display=swap" media="print" onload="this.media='all'; this.onload=null;">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Merriweather:400,700|Oswald:400&display=swap"></noscript>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

</head>
